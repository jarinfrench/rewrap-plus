name: Bug report
description: Something wrapped incorrectly, or didn't wrap when it should have.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a *string literal's runtime value changed* after wrapping, please
        use the **String corruption** template instead -- that failure mode
        gets triaged separately and with higher priority.

  - type: input
    id: vscode-version
    attributes:
      label: VSCode version
      description: Help > About, or `code --version`.
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Rewrap+ extension version
      description: Extensions view > Rewrap+ > version, or the `package.json` version if built from source.
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language / adapter
      description: e.g. Python, TypeScript, C++, Markdown, PowerShell (comment-only)...
    validations:
      required: true

  - type: textarea
    id: resolved-config
    attributes:
      label: Column limit setting and resolved source
      description: >
        Run **Rewrap+: Show Resolved Configuration** and paste its output
        here -- it reports the effective column limit, which precedence
        tier it came from, and the active string/doc-dialect policy.
      placeholder: |
        columnLimit: 88 (source: .editorconfig max_line_length)
        stringPolicy: ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest input that shows the bug. Include the file's language and any relevant `rewrapPlus.*` settings or `.editorconfig` values.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual output
    validations:
      required: true

  - type: dropdown
    id: skipped
    attributes:
      label: Was the wrap skipped?
      description: >
        If nothing happened at all, check the "Rewrap+" output channel for
        a skip reason before filing -- it's the fastest way to tell an
        actual bug from an intentional skip (e.g. a `# rewrap: off` region,
        an unsupported language, or a prose heuristic decision).
      options:
        - "No -- it wrapped, just incorrectly"
        - "Yes -- output channel gave a reason (paste it below)"
        - "Yes -- output channel gave no reason, or channel is empty"
    validations:
      required: true

  - type: textarea
    id: skip-reason
    attributes:
      label: Output channel contents (if skipped)
      render: text
    validations:
      required: false
