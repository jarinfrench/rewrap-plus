name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  ci:
    name: lint, typecheck, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node LTS matrix: current LTS and the previous one.
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package .vsix, attach to GitHub Release, and publish
    # Only on a version tag push (v*), and only once every `ci` matrix
    # leg has passed on that exact tagged commit — packaging a build
    # that hasn't cleared the same gate every other commit has to is
    # exactly the "no broken intermediates" rule CLAUDE.md states for
    # local commits, extended to what actually reaches a release.
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # A single, current-LTS build — `ci` above already proved this
          # commit builds and tests clean across the full Node matrix;
          # this job exists to produce the one artifact that ships, not
          # to re-prove matrix compatibility.
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package .vsix
        working-directory: packages/vscode-extension
        run: npm run package

      - name: Upload .vsix as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rewrap-plus-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error

      - name: Attach .vsix to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            packages/vscode-extension/*.vsix \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"

      # Publish the exact .vsix already attached to the release above,
      # rather than repackaging — what a user downloads from the release
      # and what ships to each registry should be byte-identical.
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath packages/vscode-extension/*.vsix

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish packages/vscode-extension/*.vsix -p "$OVSX_PAT"
