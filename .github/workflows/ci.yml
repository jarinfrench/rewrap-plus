name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  ci:
    name: lint, typecheck, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Node LTS matrix: current LTS and the previous one.
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Dry run only (output discarded) -- confirms the generator still
      # runs cleanly against whatever `packages/engine` looks like on this
      # PR/commit, so a change that breaks it (a descriptor missing an
      # expected field, an import that no longer resolves) fails PR CI
      # instead of only surfacing later when the `pages` job's own build
      # tries to deploy it.
      - name: Dry-run site data generator
        run: node scripts/generate-site-data.mjs

  integration:
    name: VSCode integration tests (non-blocking)
    # New CI automation, not yet proven stable on a runner -- continue-on-error
    # keeps this from being able to hold up a merge on day one, while still
    # showing a clearly visible warning (rather than a silently swallowed
    # failure) on the PR checks list if it does fail. Not added to branch
    # protection's required checks either, for the same reason -- see
    # docs/known-gaps.md. Graduating both of those is a deliberate future
    # decision once this has a track record on ubuntu-latest, not an
    # oversight.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # packages/vscode-extension's own build (scripts/build.mjs) bundles
      # @rewrap-plus/engine's *compiled* dist/ directly -- `npm run
      # test:integration`'s own pretest step only rebuilds the extension
      # itself, not the engine it depends on -- so the engine needs
      # building here first, the same as the `ci` job's separate `npm run
      # build` step above.
      - name: Build
        run: npm run build

      # @vscode/test-electron downloads and launches a real VSCode build,
      # which needs a display server on a headless Linux runner.
      # GitHub's own ubuntu-latest image (Ubuntu 24.04) dropped Xvfb from
      # its preinstalled packages in early 2025, so a bare `xvfb-run`
      # would fail with "command not found" here rather than actually
      # testing anything -- exactly the "works locally, hangs/fails in
      # CI" trap this step is chosen to avoid. coactions/setup-xvfb
      # installs Xvfb itself and wraps the given command with
      # `xvfb-run`, the same pattern VS Code's own extension-testing docs
      # recommend (https://code.visualstudio.com/api/working-with-extensions/continuous-integration).
      - name: Run integration suite under Xvfb
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          working-directory: packages/vscode-extension
          run: npm run test:integration

  pages:
    name: Build and deploy GitHub Pages site
    # Same "only deploy what already passed CI" pattern the tag-triggered
    # `package` job above already uses, adapted to `main`: only after
    # every `ci` matrix leg passes on this exact pushed commit, and only
    # on a real push to `main` (never a `pull_request` run, which would
    # otherwise let an untrusted PR branch deploy to the live site).
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Populates site/data/languages.json from packages/engine's own
      # adapter registry -- see scripts/generate-site-data.mjs's own doc
      # comment. Not committed (site/data/ is .gitignore'd), so this step
      # is the only place the deployed table's data ever comes from.
      - name: Generate site data
        run: node scripts/generate-site-data.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  package:
    name: Package .vsix and attach to GitHub Release
    # Only on a version tag push (v*), and only once every `ci` matrix
    # leg has passed on that exact tagged commit -- packaging a build
    # that hasn't cleared the same gate every other commit has to is
    # exactly the "no broken intermediates" rule CLAUDE.md states for
    # local commits, extended to what actually reaches a release.
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # A single, current-LTS build -- `ci` above already proved this
          # commit builds and tests clean across the full Node matrix;
          # this job exists to produce the one artifact that ships, not
          # to re-prove matrix compatibility.
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package .vsix
        working-directory: packages/vscode-extension
        run: npm run package

      - name: Upload .vsix as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rewrap-plus-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error

      - name: Attach .vsix to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            packages/vscode-extension/*.vsix \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"

  publish:
    name: Publish to Marketplace and Open VSX
    # Gated on the `marketplace-publish` GitHub Environment, which carries a
    # required-reviewer protection rule (configured via the API, not this
    # file -- see repo Settings > Environments). A `v*` tag push queues this
    # job but it sits paused until a reviewer approves the deployment; the
    # tag trigger alone can never reach vsce/ovsx publish unmoderated.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: npm

      # npm workspaces hoists `@vscode/vsce`/`ovsx` (devDependencies of
      # packages/vscode-extension) so `npx` below resolves the pinned
      # version instead of falling back to whatever's latest on the npm
      # registry.
      - name: Install dependencies
        run: npm ci

      # Downloaded from the `package` job's own workflow artifact rather
      # than rebuilt, so what a user downloads from the GitHub Release and
      # what ships to each registry are byte-identical.
      - name: Download .vsix built by the package job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rewrap-plus-vsix
          path: packages/vscode-extension

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath packages/vscode-extension/*.vsix

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish packages/vscode-extension/*.vsix -p "$OVSX_PAT"
